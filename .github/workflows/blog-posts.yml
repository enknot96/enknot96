name: Latest dev.to posts

on:
  schedule:
    - cron: "17 21 * * *" # every day, 06:17 JST
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-posts.mjs"
      - ".github/workflows/blog-posts.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-posts.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update latest dev.to posts"
          git push
